<!doctype html>
<html>
  <head>
    <title>admin</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto w-full max-w-2xl space-y-6 rounded-lg bg-white p-6 shadow-sm">
      <div>
        <h3 class="mb-3 text-lg font-semibold text-slate-900">User request:</h3>
      </div>
      <div>
        <h3 class="mb-2 font-medium text-slate-700">URLs</h3>
        <ol id="url-list" class="mb-3 list-disc pl-6 text-slate-600"></ol>
        <div class="flex flex-col gap-2">
          <textarea id="url-in" class="rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          <button class="w-full rounded-full bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 hover:cursor-pointer" id="url-button" onclick="urlbutton()">Submit URLs</button>
        </div>
      </div>
      <div>
        <h3 class="mb-2 font-medium text-slate-700">Categories</h3>
        <ol id="category-list" class="mb-3 list-disc pl-6 text-slate-600"></ol>
        <div class="flex flex-col gap-2">
          <textarea id="category-in" class="rounded-md border border-slate-300 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          <button class="w-full rounded-full bg-blue-600 px-4 py-2 text-white hover:bg-blue-700 hover:cursor-pointer" id="category-button" onclick="categorybutton()">Submit categories</button>
        </div>
      </div>

      <button class="w-full rounded-full bg-slate-900 px-4 py-2 text-white hover:bg-slate-800 hover:cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed" id="all-button" onclick="submitall()">Submit URLs and Categories</button>
    </div>
</body>

<script>
    const API_BASE = location.protocol.startsWith("http") ? "" : "http://localhost:8000";
    const categoryInput = document.getElementById('category-in');
    const categoryList = document.getElementById('category-list');
    const urlInput = document.getElementById('url-in');
    const urlList = document.getElementById('url-list');
    // const categoryButton = document.getElementById("category-button");

    let savedCats = JSON.parse(localStorage.getItem('categories')) || [];

    const renderCatList = () => {
    categoryList.innerHTML = savedCats
        .map(item => `<li>${item}</li>`)
        .join('');
    };

    function categorybutton() {
        const newValues = categoryInput.value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        if (newValues.length) {
            savedCats.push(...newValues);
            localStorage.setItem('categories', JSON.stringify(savedCats));
            categoryInput.value = '';
        }
        renderCatList()

    }

    let savedUrls = JSON.parse(localStorage.getItem('urls')) || [];

    const renderUrlList = () => {
    urlList.innerHTML = savedUrls
        .map(item => `<li>${item}</li>`)
        .join('');
    };

    function urlbutton() {
        const newValues = urlInput.value.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        if (newValues.length) {
            savedUrls.push(...newValues);
            localStorage.setItem('urls', JSON.stringify(savedUrls));
            urlInput.value = '';
        }
        renderUrlList()
    }

    async function submitall() {
        categorybutton();
        urlbutton();
        const url = `${API_BASE}/createjob`;
        const data = {savedCats, savedUrls, "client_id": "apple"};

        document.getElementById('all-button').disabled = true;

        try {
            const response = await fetch(url, {
                method: 'POST', 
                headers: {
                'Content-Type': 'application/json' 
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const result = await response.json();
            console.log('Success:', result);
        } catch (error) {
            console.error('Error:', error);
        }

        localStorage.clear();
            
        urlList.innerHTML = ""
        categoryList.innerHTML = ""
        location.reload();
    }
</script>
</html>
