<!doctype html>
<html>
  <head>
    <title>qc</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="min-h-screen bg-slate-100 px-4 py-8">
    <div class="mx-auto w-full max-w-2xl space-y-6 rounded-lg bg-white p-6 shadow-sm">

      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-900">Quality Control</h2>
        <div class="flex gap-3">
          <button onclick="runQc()" class="text-sm text-blue-600 hover:text-blue-800 hover:underline hover:cursor-pointer">Run AI QC</button>
          <button onclick="loadTasks()" class="text-sm text-slate-500 hover:text-slate-700 hover:underline hover:cursor-pointer">Refresh</button>
        </div>
      </div>

      <!-- Loading -->
      <div id="loading" class="text-center py-8">
        <p class="text-slate-500">Loading tasks...</p>
      </div>

      <!-- No tasks -->
      <div id="no-tasks" style="display: none;" class="text-center py-8">
        <p class="text-slate-500 text-lg">No tasks need QC right now.</p>
        <p class="text-slate-400 text-sm mt-2">Check back later or refresh.</p>
      </div>

      <!-- Task queue count -->
      <div id="queue-info" style="display: none;" class="text-sm text-slate-500">
        <span id="queue-count"></span> task(s) need review
      </div>

      <!-- Current task -->
      <div id="task-area" style="display: none;">

        <!-- Media -->
        <div class="mb-4">
          <img id="image" style="height: 0px; width: auto;" src="">
          <video id="video" style="height: 0px; width: auto;" src=""></video>
          <audio id="audio" style="height: 0px; width: auto;" src=""></audio>
          <iframe id="iframe" style="height: 0px; width: auto;" src=""></iframe>
        </div>

        <!-- Labeller info -->
        <div class="flex items-center gap-4 text-sm text-slate-500 mb-4">
          <span>Labeller: <span id="task-labeller" class="font-medium text-slate-700"></span></span>
          <span>QC Round: <span id="task-qc-round" class="font-medium text-slate-700"></span></span>
        </div>

        <!-- Labels submitted -->
        <div class="rounded-md bg-slate-50 border border-slate-200 p-4 space-y-3">
          <h3 class="font-medium text-slate-700">Submitted labels:</h3>
          <div id="submitted-labels" class="space-y-1"></div>
        </div>

        <!-- Categories (for reference) -->
        <div class="mt-3 text-sm text-slate-500">
          <span class="font-medium">Allowed categories:</span> <span id="allowed-categories"></span>
        </div>

        <!-- Action buttons -->
        <div class="flex gap-3 mt-6">
          <button onclick="approveTask()" id="approve-btn"
            class="flex-1 rounded-full bg-emerald-600 px-4 py-2 text-white hover:bg-emerald-700 hover:cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            Approve
          </button>
          <button onclick="relabelTask()" id="relabel-btn"
            class="flex-1 rounded-full bg-amber-500 px-4 py-2 text-white hover:bg-amber-600 hover:cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            Send Back to Labeller
          </button>
        </div>
      </div>

    </div>
  </body>

  <script>
    const API_BASE = location.protocol.startsWith("http") ? "" : "http://localhost:8000";
    let currentTask = null;
    let taskQueue = [];

    // --- Visibility helpers ---

    function showEl(id, show) {
      document.getElementById(id).style.display = show ? "block" : "none";
    }

    // --- Load tasks ---

    async function loadTasks() {
      showEl("loading", true);
      showEl("no-tasks", false);
      showEl("task-area", false);
      showEl("queue-info", false);

      try {
        const response = await fetch(`${API_BASE}/qc_tasks`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const result = await response.json();
        taskQueue = result.tasks || [];

        showEl("loading", false);

        if (taskQueue.length === 0) {
          showEl("no-tasks", true);
          return;
        }

        document.getElementById("queue-count").textContent = taskQueue.length;
        showEl("queue-info", true);
        showNextTask();
      } catch (error) {
        console.error("Error loading QC tasks:", error);
        showEl("loading", false);
        showEl("no-tasks", true);
      }
    }

    // --- Run AI QC then load tasks ---

    async function runQc() {
      showEl("loading", true);
      showEl("no-tasks", false);
      showEl("task-area", false);

      try {
        await fetch(`${API_BASE}/run-qc`, { method: "POST" });
        await loadTasks();
      } catch (error) {
        console.error("Error running QC:", error);
        showEl("loading", false);
        showEl("no-tasks", true);
      }
    }

    // --- Show next task ---

    function showNextTask() {
      if (taskQueue.length === 0) {
        showEl("task-area", false);
        showEl("no-tasks", true);
        document.getElementById("queue-count").textContent = "0";
        return;
      }

      currentTask = taskQueue[0];
      showEl("task-area", true);
      showEl("no-tasks", false);
      document.getElementById("queue-count").textContent = taskQueue.length;

      renderMedia(currentTask);
      document.getElementById("task-labeller").textContent = currentTask.labeller_id || "unknown";
      document.getElementById("task-qc-round").textContent = currentTask.qc_round;
      document.getElementById("allowed-categories").textContent = currentTask.categories;

      renderLabels(currentTask);

      document.getElementById("approve-btn").disabled = false;
      document.getElementById("relabel-btn").disabled = false;
    }

    // --- Render media ---

    function renderMedia(task) {
      ["image", "video", "audio", "iframe"].forEach(id => {
        const el = document.getElementById(id);
        el.src = "";
        el.style.height = "0px";
      });

      const url = task.url;
      const ext = url.split(".").pop().toLowerCase();

      const imageExts = ["jpg", "jpeg", "png", "gif", "webp"];
      const videoExts = ["mp4", "webm", "ogg", "mov"];
      const audioExts = ["mp3", "wav", "aac", "m4a"];

      let el;
      if (imageExts.includes(ext)) el = document.getElementById("image");
      else if (videoExts.includes(ext)) el = document.getElementById("video");
      else if (audioExts.includes(ext)) el = document.getElementById("audio");
      else if (url.includes("embed")) el = document.getElementById("iframe");

      if (el) {
        el.src = url;
        el.style.height = "300px";
      }
    }

    // --- Render labels ---

    function renderLabels(task) {
      const container = document.getElementById("submitted-labels");
      let labels = [];

      if (task.label) {
        try {
          // label is stored as a Python list string e.g. "['cat1', 'other']"
          labels = JSON.parse(task.label.replace(/'/g, '"'));
        } catch {
          labels = [task.label];
        }
      }

      if (labels.length === 0 || (labels.length === 1 && labels[0] === "")) {
        container.innerHTML = '<p class="text-sm text-slate-400 italic">No labels submitted</p>';
        return;
      }

      container.innerHTML = labels.map(label =>
        `<div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-500"></span>
          <span class="text-sm text-slate-700">${label}</span>
        </div>`
      ).join("");
    }

    // --- Approve ---

    async function approveTask() {
      if (!currentTask) return;
      const btn = document.getElementById("approve-btn");
      btn.disabled = true;
      document.getElementById("relabel-btn").disabled = true;

      try {
        const response = await fetch(`${API_BASE}/humanqc`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: currentTask.task_id, action: "approve" }),
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        taskQueue.shift();
        showNextTask();
      } catch (error) {
        console.error("Error approving task:", error);
        window.alert("Approve failed. Please try again.");
        btn.disabled = false;
        document.getElementById("relabel-btn").disabled = false;
      }
    }

    // --- Relabel ---

    async function relabelTask() {
      if (!currentTask) return;
      const btn = document.getElementById("relabel-btn");
      btn.disabled = true;
      document.getElementById("approve-btn").disabled = true;

      try {
        const response = await fetch(`${API_BASE}/humanqc`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: currentTask.task_id, action: "relabel" }),
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        taskQueue.shift();
        showNextTask();
      } catch (error) {
        console.error("Error relabelling task:", error);
        window.alert("Send back failed. Please try again.");
        btn.disabled = false;
        document.getElementById("approve-btn").disabled = false;
      }
    }

    // --- Init ---

    loadTasks();
  </script>

</html>
